name: Release

# Manually triggered: pick patch/minor/major, tests run first, and on success
# a new semver tag + GitHub release (with generated notes) is created.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    runs-on: ubuntu-latest
    needs: test
    # Go module versions are git tags, so only master commits get released
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the latest tag is reachable for git describe
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          latest=$(git describe --tags --abbrev=0)
          IFS='.' read -r major minor patch <<< "${latest#v}"
          case "${{ inputs.bump }}" in
            major) next="v$((major + 1)).0.0" ;;
            minor) next="v${major}.$((minor + 1)).0" ;;
            patch) next="v${major}.${minor}.$((patch + 1))" ;;
          esac
          echo "Bumping ${latest} -> ${next}"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.next }}" \
            --target "$GITHUB_SHA" \
            --generate-notes
