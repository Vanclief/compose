name: Test

on:
  push:
    branches: [master]
  pull_request:
  # Allows the release workflow to run this same suite as its gate
  workflow_call:

jobs:
  test:
    # The baseline tests dump a database on the service with the runner's pg_dump
    # and load the dump back, which needs both on one major: a newer pg_dump
    # writes settings the server refuses, an older one refuses the server.
    # Ubuntu 24.04 has pg_dump 16; move this and the postgres image together
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: compose_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # PostgreSQL is provided above, so its tests must run instead of skip
      COMPOSE_TEST_POSTGRES: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The AWS integration tests skip themselves when credentials are absent,
      # so the full suite is safe to run without AWS secrets
      - name: Test
        run: go test ./... -count=1 -race

  test-go-1-27:
    # Go 1.27 runs encoding/json on encoding/json/v2, whose rules the OpenAPI
    # generator and the route registry follow there. With no PostgreSQL service
    # and no COMPOSE_TEST_POSTGRES the PostgreSQL tests skip; the job above
    # runs them, and -race, on the go.mod toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      # Test with the Go set up below, never a toolchain go.mod asks for
      GOTOOLCHAIN: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"

      - name: Test
        run: go test ./... -count=1
